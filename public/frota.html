<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central da Frota — Rezende Energia</title>
  <link rel="icon" href="/img/favicon.png">
  <script src="/js/rezende-tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/rezende-tema.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--f-texto);
      font-size: 15px; line-height: 1.5;
      color: var(--texto);
      background: var(--fundo);
      display: flex; flex-direction: column; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Cabeçalho ─────────────────────────────────────── */
    .cabecalho {
      background: var(--sup);
      border-bottom: 1px solid var(--linha);
      padding: 0 1.5rem;
      display: flex; align-items: center; gap: 1rem;
      flex-wrap: wrap;
      box-shadow: var(--sombra);
    }
    .cab-logo { height: 30px; padding: .75rem 0; display: block; }
    .logo-escuro { display: none; }
    :root[data-theme="escuro"] .logo-claro { display: none; }
    :root[data-theme="escuro"] .logo-escuro { display: block; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .logo-claro { display: none; }
      :root:not([data-theme]) .logo-escuro { display: block; }
    }

    .cab-titulo {
      font-family: var(--f-titulo);
      font-size: 1rem; font-weight: 600;
      color: var(--laranja-texto);
      flex: 1; white-space: nowrap;
    }

    .cab-dir { display: flex; align-items: center; gap: .6rem; }
    .cab-usuario { font-size: .85rem; color: var(--texto-2); font-weight: 500; }

    .btn-sair {
      background: none; border: 1px solid var(--linha-forte);
      color: var(--texto-3); border-radius: 8px;
      padding: .3rem .75rem; font: 500 .82rem var(--f-texto); cursor: pointer;
      transition: color var(--transicao), border-color var(--transicao);
    }
    .btn-sair:hover { color: var(--alerta); border-color: var(--alerta); }

    /* ── Abas ───────────────────────────────────────────── */
    .abas-nav {
      background: var(--sup);
      border-bottom: 1px solid var(--linha);
      padding: 0 1.5rem;
      display: flex; gap: 0; overflow-x: auto;
    }
    .aba-btn {
      background: none; border: none; cursor: pointer;
      font: 600 .88rem/1 var(--f-texto);
      color: var(--texto-3);
      padding: .9rem 1.1rem;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: color var(--transicao), border-color var(--transicao);
    }
    .aba-btn:hover { color: var(--laranja-texto); }
    .aba-btn.ativa { color: var(--laranja-texto); border-bottom-color: var(--laranja); }

    /* ── Conteúdo ───────────────────────────────────────── */
    .conteudo { flex: 1; padding: 1.5rem; max-width: 1200px; width: 100%; margin: 0 auto; overflow-x: hidden; min-width: 0; }

    /* ── Spinner ────────────────────────────────────────── */
    .estado-global {
      display: flex; align-items: center; justify-content: center;
      gap: .75rem; padding: 3rem 1rem;
      font-size: 1rem; color: var(--texto-3);
    }
    .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 3px solid var(--linha-forte);
      border-top-color: var(--laranja);
      animation: giro .7s linear infinite; flex-shrink: 0;
    }
    @keyframes giro { to { transform: rotate(360deg); } }

    /* ── Aviso de erro de fonte ─────────────────────────── */
    .aviso-erro {
      background: var(--aviso-fundo); border: 1px solid var(--aviso);
      border-radius: 10px; padding: .75rem 1rem;
      font-size: .85rem; color: var(--aviso); margin-bottom: 1rem;
      display: flex; gap: .5rem; align-items: flex-start;
    }

    /* ── Cards de indicadores ───────────────────────────── */
    .indicadores-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem; margin-bottom: 1.5rem;
    }
    .ind-card {
      background: var(--sup);
      border: 1px solid var(--linha);
      border-radius: var(--raio); padding: 1.1rem 1.2rem;
      box-shadow: var(--sombra);
    }
    .ind-label {
      font-size: .75rem; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; color: var(--texto-3); margin-bottom: .4rem;
    }
    .ind-valor {
      font-family: var(--f-titulo);
      font-size: 2rem; font-weight: 700; line-height: 1;
      color: var(--texto);
    }
    .ind-valor.laranja { color: var(--laranja-texto); }
    .ind-valor.alerta  { color: var(--alerta); }
    .ind-detalhe { font-size: .8rem; color: var(--texto-3); margin-top: .3rem; }

    /* ── Seção com título ───────────────────────────────── */
    .secao { margin-bottom: 1.75rem; }
    .secao-titulo {
      font-family: var(--f-titulo);
      font-size: 1rem; font-weight: 600; margin-bottom: .9rem;
      color: var(--texto-2);
      display: flex; align-items: center; gap: .5rem;
    }
    .secao-titulo::after { content: ''; flex: 1; height: 1px; background: var(--linha); }

    /* ── Tabela ─────────────────────────────────────────── */
    .tabela-wrap { overflow-x: auto; border-radius: var(--raio-p); border: 1px solid var(--linha); }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    thead th {
      background: var(--sup-2); font-weight: 600; text-align: left;
      padding: .65rem .85rem; border-bottom: 1px solid var(--linha);
      white-space: nowrap; color: var(--texto-3);
      font-size: .75rem; letter-spacing: .05em; text-transform: uppercase;
    }
    tbody tr { border-bottom: 1px solid var(--linha); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--laranja-fundo); }
    tbody td { padding: .6rem .85rem; }

    /* ── Chips ──────────────────────────────────────────── */
    .chip {
      display: inline-block; background: var(--neutro-fundo);
      border-radius: 20px; padding: .15rem .6rem;
      font-size: .75rem; font-weight: 600; white-space: nowrap;
      color: var(--texto-2);
    }

    /* ── Seletor de período ─────────────────────────────── */
    .periodo-sel { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .periodo-btn {
      background: var(--sup); border: 1px solid var(--linha);
      color: var(--texto-2); border-radius: 8px;
      padding: .3rem .75rem; font: 600 .82rem var(--f-texto); cursor: pointer;
      transition: all var(--transicao);
    }
    .periodo-btn:hover { border-color: var(--laranja); color: var(--laranja-texto); }
    .periodo-btn.ativo { background: var(--laranja); border-color: var(--laranja); color: var(--sobre-laranja); }

    /* ── Grid de abastecimento ──────────────────────────── */
    .abast-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem; margin-bottom: 1.5rem;
    }

    /* ── Grupos por tipo (barras) ───────────────────────── */
    .grupo-lista { display: flex; flex-direction: column; gap: .5rem; }
    .grupo-item { display: flex; align-items: center; gap: .75rem; font-size: .88rem; }
    .grupo-nome { width: 180px; flex-shrink: 0; color: var(--texto); }
    .grupo-barra-wrap { flex: 1; height: 8px; background: var(--linha); border-radius: 4px; overflow: hidden; }
    .grupo-barra { height: 100%; background: var(--laranja); border-radius: 4px; transition: width .4s; }
    .grupo-qtd { width: 32px; text-align: right; font-weight: 700; color: var(--texto); }

    /* ── Manutenção BI ──────────────────────────────────── */
    .manut-filtros {
      display: flex; flex-wrap: wrap; gap: .6rem; align-items: flex-end;
      margin-bottom: 1.25rem;
    }
    .manut-filtro-grupo { display: flex; flex-direction: column; gap: .25rem; }
    .manut-filtro-label {
      font-size: .68rem; font-weight: 700; color: var(--texto-3);
      text-transform: uppercase; letter-spacing: .05em;
    }
    .manut-sel {
      height: 32px; padding: 0 .6rem;
      border: 1px solid var(--linha-forte); border-radius: var(--raio-p);
      background: var(--sup); color: var(--texto);
      font: .82rem var(--f-texto); cursor: pointer; outline: none;
      min-width: 150px; transition: border-color var(--transicao);
    }
    .manut-sel:focus { border-color: var(--laranja); }
    .btn-limpar-manut {
      height: 32px; padding: 0 .75rem; align-self: flex-end;
      border: 1px solid var(--linha-forte); border-radius: var(--raio-p);
      background: transparent; color: var(--texto-2);
      font: .82rem var(--f-texto); cursor: pointer;
      transition: background var(--transicao);
    }
    .btn-limpar-manut:hover { background: var(--sup-3); }
    .manut-abas {
      display: flex; gap: 2px; flex-wrap: wrap;
      border-bottom: 2px solid var(--linha); margin-bottom: 1.25rem;
    }
    .manut-aba-btn {
      padding: .55rem 1rem; border: none; background: transparent;
      font: 600 .82rem var(--f-titulo); color: var(--texto-3);
      cursor: pointer; border-radius: var(--raio-p) var(--raio-p) 0 0;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      transition: color var(--transicao), border-color var(--transicao);
    }
    .manut-aba-btn:hover { color: var(--texto); }
    .manut-aba-btn.ativa { color: var(--laranja-texto); border-bottom-color: var(--laranja); }
    .manut-painel { display: none; }
    .manut-painel.ativo { display: block; min-width: 0; overflow-x: hidden; }
    .charts-grid-manut {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem; margin-bottom: 1.5rem;
      min-width: 0; overflow: hidden;
    }
    .chart-card-manut {
      background: var(--sup); border: 1px solid var(--linha);
      border-radius: var(--raio); padding: 1rem 1.1rem;
      box-shadow: var(--sombra); min-width: 0; overflow: hidden;
      max-width: 100%;
    }
    .chart-card-manut canvas { max-width: 100%; }
    .chart-card-manut.wide { grid-column: 1 / -1; min-width: 0; }
    .chart-titulo-manut {
      font: 700 .88rem var(--f-titulo); color: var(--texto-2);
      margin-bottom: .75rem;
      padding-bottom: .6rem; border-bottom: 1px solid var(--linha);
    }
    .manut-busca {
      height: 32px; padding: 0 .7rem;
      border: 1px solid var(--linha-forte); border-radius: var(--raio-p);
      background: var(--sup-2); color: var(--texto);
      font: .82rem var(--f-texto); outline: none; min-width: 200px;
      transition: border-color var(--transicao);
    }
    .manut-busca:focus { border-color: var(--laranja); }
    .chip-corretiva { background: var(--alerta-fundo,rgba(244,63,94,.11)); color: var(--alerta); }
    .chip-preventiva { background: var(--ok-fundo,rgba(16,185,129,.13)); color: var(--ok); }
    .chip-peca  { background: var(--laranja-fundo); color: var(--laranja-texto); }
    .chip-serv  { background: var(--aviso-fundo,rgba(245,158,11,.15)); color: var(--aviso); }
    .manut-pag {
      display: flex; align-items: center; justify-content: flex-end; gap: .5rem;
      padding: .6rem .9rem; border-top: 1px solid var(--linha);
      font-size: .78rem; color: var(--texto-3);
    }
    .manut-pag-btn {
      height: 26px; padding: 0 .7rem;
      border: 1px solid var(--linha-forte); border-radius: var(--raio-p);
      background: var(--sup-2); color: var(--texto-2);
      font-size: .78rem; cursor: pointer;
    }
    .manut-pag-btn:disabled { opacity: .4; cursor: default; }
    .manut-pag-btn:not(:disabled):hover { background: var(--sup-3); }
    thead th[data-col] { cursor: pointer; user-select: none; }
    thead th[data-col]:hover { color: var(--texto); }

    /* ── Card de rastreamento ───────────────────────────── */
    .rast-promo {
      background: var(--sup); border: 1px solid var(--linha);
      border-radius: var(--raio); padding: 2rem 1.75rem;
      display: flex; flex-direction: column; gap: 1.1rem; max-width: 520px;
      box-shadow: var(--sombra);
    }
    .rast-promo h2 {
      font-family: var(--f-titulo);
      font-size: 1.4rem; font-weight: 600; color: var(--texto); margin: 0;
    }
    .rast-promo p  { font-size: .92rem; color: var(--texto-2); line-height: 1.6; margin: 0; }
    .rast-promo ul { font-size: .88rem; color: var(--texto-2); line-height: 2; padding-left: 1.2rem; margin: 0; }

    .btn-primario {
      display: inline-flex; align-items: center; gap: .5rem;
      background: var(--laranja); color: var(--sobre-laranja);
      padding: .7rem 1.3rem; border-radius: var(--raio-p);
      font: 600 .95rem var(--f-texto); text-decoration: none;
      transition: background var(--transicao);
      align-self: flex-start;
    }
    .btn-primario:hover { background: var(--laranja-hover); }

    @media (max-width: 600px) {
      .cabecalho { gap: .5rem; padding: 0 1rem; }
      .conteudo  { padding: 1rem; }
      .abas-nav  { padding: 0 1rem; }
      .grupo-nome { width: 120px; font-size: .82rem; }
    }
  </style>
</head>
<body>
  <!-- Cabeçalho -->
  <header class="cabecalho">
    <img class="cab-logo logo-claro" src="/img/logo-rezende.png" alt="Rezende Energia">
    <img class="cab-logo logo-escuro" src="/img/logo-rezende-branca.png" alt="Rezende Energia">
    <span class="cab-titulo">Central da Frota</span>
    <div class="cab-dir">
      <span class="cab-usuario" id="nomeUsuario">—</span>
      <button class="rz-tema-btn" type="button" data-rz-tema aria-label="Alternar modo claro/escuro">
        <svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
      <button class="btn-sair" id="btnSair">Sair</button>
    </div>
  </header>

  <!-- Abas -->
  <nav class="abas-nav" role="tablist">
    <button class="aba-btn ativa" data-aba="indicadores" role="tab" aria-selected="true">Indicadores</button>
    <button class="aba-btn" data-aba="locacao"       role="tab" aria-selected="false">Locação</button>
    <button class="aba-btn" data-aba="abastecimento" role="tab" aria-selected="false">Abastecimento</button>
    <button class="aba-btn" data-aba="manutencao"    role="tab" aria-selected="false">Manutenção</button>
    <button class="aba-btn" data-aba="rastreamento"  role="tab" aria-selected="false">Rastreamento</button>
  </nav>

  <!-- Conteúdo -->
  <main class="conteudo" id="conteudo">
    <div class="estado-global" id="carregando">
      <span class="spinner"></span> Carregando dados da frota…
    </div>
  </main>

  <script src="/frota.js"></script>
</body>
</html>
