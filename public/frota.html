<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central da Frota — Rezende Energia</title>
  <link rel="icon" href="/img/favicon.png">
  <script src="/js/rezende-tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/rezende-tema.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--f-texto);
      font-size: 15px; line-height: 1.5;
      color: var(--texto);
      background: var(--fundo);
      display: flex; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ═══════════════════════════════════════════════════
       SIDEBAR
    ═══════════════════════════════════════════════════ */
    :root { --sidebar-w: 252px; }

    .sidebar {
      width: var(--sidebar-w);
      background: var(--rz-azul-850);
      border-right: 1px solid rgba(255,255,255,.07);
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 200;
      display: flex; flex-direction: column;
      transition: transform .28s cubic-bezier(.4,0,.2,1);
      overflow-y: auto; overflow-x: hidden;
    }
    :root[data-theme="escuro"] .sidebar { background: var(--rz-azul-900); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .sidebar { background: var(--rz-azul-900); }
    }

    .sidebar-header {
      padding: 20px 18px 16px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      flex-shrink: 0;
    }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .sidebar-logo img { height: 28px; display: block; }
    .sidebar-logo .logo-escuro { display: block; }
    .sidebar-logo .logo-claro  { display: none; }

    .sidebar-badge {
      display: inline-block;
      background: var(--laranja); color: #1A0F02;
      font: 700 11px/1 var(--f-titulo); letter-spacing: .04em;
      padding: 4px 12px; border-radius: 20px;
      box-shadow: 0 3px 10px rgba(247,147,30,.35);
    }

    .sidebar-nav {
      flex: 1; padding: 10px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .nav-secao {
      font-size: 10px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: rgba(255,255,255,.3);
      padding: 12px 6px 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: var(--raio-p);
      color: rgba(255,255,255,.65);
      font-size: 13.5px; font-weight: 500;
      cursor: pointer; border: none; background: none;
      text-align: left; width: 100%;
      transition: all .18s; position: relative;
    }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .nav-item:hover {
      background: rgba(255,255,255,.07);
      color: rgba(255,255,255,.9);
      transform: translateX(2px);
    }
    .nav-item.active {
      background: var(--laranja); color: #1A0F02;
      font-weight: 700; box-shadow: 0 4px 14px rgba(247,147,30,.3);
    }
    .nav-item.active::after {
      content: ''; position: absolute; right: 12px;
      width: 6px; height: 6px; background: rgba(26,15,2,.5);
      border-radius: 50%; animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { opacity: .6; transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.3); }
    }

    .sidebar-footer {
      padding: 12px 14px; border-top: 1px solid rgba(255,255,255,.07);
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .sidebar-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--laranja); color: #1A0F02;
      display: flex; align-items: center; justify-content: center;
      font: 700 13px var(--f-titulo); flex-shrink: 0;
    }
    .sidebar-user-info { flex: 1; min-width: 0; }
    .sidebar-user-name {
      font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.85);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sidebar-user-role { font-size: 10.5px; color: rgba(255,255,255,.4); }
    .btn-sair-sidebar {
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,.35); padding: 4px; border-radius: 6px;
      transition: color .18s, background .18s; flex-shrink: 0;
    }
    .btn-sair-sidebar:hover { color: rgba(255,255,255,.8); background: rgba(255,255,255,.08); }
    .btn-sair-sidebar svg { width: 16px; height: 16px; display: block; }

    .sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(7,11,20,.65); z-index: 199;
      backdrop-filter: blur(2px);
    }

    /* ═══════════════════════════════════════════════════
       ÁREA PRINCIPAL
    ═══════════════════════════════════════════════════ */
    .main {
      margin-left: var(--sidebar-w); flex: 1;
      display: flex; flex-direction: column; min-width: 0;
    }

    .topbar {
      background: var(--sup); border-bottom: 1px solid var(--linha);
      padding: 0 24px; height: 60px;
      display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 100; flex-shrink: 0;
    }
    .btn-menu {
      display: none;
      background: none; border: 1px solid var(--linha-forte);
      color: var(--texto-2); border-radius: 8px;
      width: 36px; height: 36px; cursor: pointer;
      align-items: center; justify-content: center;
      transition: color .18s, background .18s; flex-shrink: 0;
    }
    .btn-menu:hover { background: var(--sup-3); color: var(--texto); }
    .btn-menu svg { width: 18px; height: 18px; display: block; }
    .topbar-titulo {
      font-family: var(--f-titulo); font-size: 1.1rem; font-weight: 600;
      color: var(--texto); flex: 1;
    }
    .topbar-acoes { display: flex; align-items: center; gap: 8px; }

    .pagina { flex: 1; padding: 24px; overflow-x: hidden; }

    /* ── Spinner ── */
    .estado-global {
      display: flex; align-items: center; justify-content: center;
      gap: .75rem; padding: 3rem 1rem;
      font-size: 1rem; color: var(--texto-3);
    }
    .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 3px solid var(--linha-forte);
      border-top-color: var(--laranja);
      animation: giro .7s linear infinite; flex-shrink: 0;
    }
    @keyframes giro { to { transform: rotate(360deg); } }

    /* ── Aviso de erro ── */
    .aviso-erro {
      background: var(--aviso-fundo); border: 1px solid var(--aviso);
      border-radius: 10px; padding: .75rem 1rem;
      font-size: .85rem; color: var(--aviso); margin-bottom: 1rem;
      display: flex; gap: .5rem; align-items: flex-start;
    }

    /* ── Indicadores ── */
    .indicadores-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem; margin-bottom: 1.5rem;
    }
    .ind-card {
      background: var(--sup); border: 1px solid var(--linha);
      border-radius: var(--raio); padding: 1.1rem 1.2rem;
      box-shadow: var(--sombra);
    }
    .ind-label {
      font-size: .75rem; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; color: var(--texto-3); margin-bottom: .4rem;
    }
    .ind-valor {
      font-family: var(--f-titulo); font-size: 2rem; font-weight: 700; line-height: 1;
      color: var(--texto);
    }
    .ind-valor.laranja { color: var(--laranja-texto); }
    .ind-valor.alerta  { color: var(--alerta); }
    .ind-detalhe { font-size: .8rem; color: var(--texto-3); margin-top: .3rem; }

    /* ── Seção ── */
    .secao { margin-bottom: 1.75rem; }
    .secao-titulo {
      font-family: var(--f-titulo); font-size: 1rem; font-weight: 600; margin-bottom: .9rem;
      color: var(--texto-2); display: flex; align-items: center; gap: .5rem;
    }
    .secao-titulo::after { content: ''; flex: 1; height: 1px; background: var(--linha); }

    /* ── Tabela ── */
    .tabela-wrap { overflow-x: auto; border-radius: var(--raio-p); border: 1px solid var(--linha); }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    thead th {
      background: var(--sup-2); font-weight: 600; text-align: left;
      padding: .65rem .85rem; border-bottom: 1px solid var(--linha);
      white-space: nowrap; color: var(--texto-3);
      font-size: .75rem; letter-spacing: .05em; text-transform: uppercase;
    }
    tbody tr { border-bottom: 1px solid var(--linha); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--laranja-fundo); }
    tbody td { padding: .6rem .85rem; }

    /* ── Chips ── */
    .chip {
      display: inline-block; background: var(--neutro-fundo);
      border-radius: 20px; padding: .15rem .6rem;
      font-size: .75rem; font-weight: 600; white-space: nowrap; color: var(--texto-2);
    }

    /* ── Período ── */
    .periodo-sel { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .periodo-btn {
      background: var(--sup); border: 1px solid var(--linha);
      color: var(--texto-2); border-radius: 8px;
      padding: .3rem .75rem; font: 600 .82rem var(--f-texto); cursor: pointer;
      transition: all var(--transicao);
    }
    .periodo-btn:hover { border-color: var(--laranja); color: var(--laranja-texto); }
    .periodo-btn.ativo { background: var(--laranja); border-color: var(--laranja); color: var(--sobre-laranja); }

    /* ── Abastecimento ── */
    .abast-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem; margin-bottom: 1.5rem;
    }
    .abast-filtros {
      display: flex; flex-wrap: wrap; gap: .6rem; align-items: flex-end;
      background: var(--sup); border: 1px solid var(--linha);
      border-radius: var(--raio); padding: .75rem 1rem; margin-bottom: 1.25rem;
    }
    .abast-filtro-grupo { display: flex; flex-direction: column; gap: .25rem; }
    .abast-filtro-label {
      font-size: .68rem; font-weight: 700; color: var(--texto-3);
      text-transform: uppercase; letter-spacing: .05em;
    }
    .abast-sel {
      height: 32px; padding: 0 .6rem;
      border: 1px solid var(--linha-forte); border-radius: var(--raio-p);
      background: var(--sup); color: var(--texto);
      font: .82rem var(--f-texto); cursor: pointer; outline: none;
      min-width: 160px; max-width: 240px;
    }
    .abast-sel:focus { border-color: var(--laranja); }
    .abast-btn-limpar {
      height: 32px; padding: 0 .9rem;
      border: 1px solid var(--linha-forte); border-radius: var(--raio-p);
      background: transparent; color: var(--texto-2);
      font: .82rem var(--f-texto); cursor: pointer;
      transition: background var(--transicao), color var(--transicao);
      align-self: flex-end;
    }
    .abast-btn-limpar:hover { background: var(--alerta-fundo); color: var(--alerta); border-color: var(--alerta); }

    /* ── Gráficos ── */
    .grafico-card {
      background: var(--sup); border: 1px solid var(--linha);
      border-radius: var(--raio); padding: 1rem 1.25rem;
    }
    .grafico-titulo {
      font-size: .78rem; font-weight: 700; color: var(--texto-2);
      text-transform: uppercase; letter-spacing: .05em; margin-bottom: .75rem;
    }
    .grafico-wrap { position: relative; }

    /* ── Grupos por barras ── */
    .grupo-lista { display: flex; flex-direction: column; gap: .5rem; }
    .grupo-item { display: flex; align-items: center; gap: .75rem; font-size: .88rem; }
    .grupo-nome { width: 180px; flex-shrink: 0; color: var(--texto); }
    .grupo-barra-wrap { flex: 1; height: 8px; background: var(--linha); border-radius: 4px; overflow: hidden; }
    .grupo-barra { height: 100%; background: var(--laranja); border-radius: 4px; transition: width .4s; }
    .grupo-qtd { width: 32px; text-align: right; font-weight: 700; color: var(--texto); }
    .grupo-valor { width: 110px; text-align: right; font-weight: 600; color: var(--texto-2); font-variant-numeric: tabular-nums; }

    /* ── Manutenção ── */
    .manut-filtros {
      display: flex; flex-wrap: wrap; gap: .6rem; align-items: flex-end; margin-bottom: 1.25rem;
    }
    .manut-filtro-grupo { display: flex; flex-direction: column; gap: .25rem; }
    .manut-filtro-label {
      font-size: .68rem; font-weight: 700; color: var(--texto-3);
      text-transform: uppercase; letter-spacing: .05em;
    }
    .manut-sel {
      height: 32px; padding: 0 .6rem;
      border: 1px solid var(--linha-forte); border-radius: var(--raio-p);
      background: var(--sup); color: var(--texto);
      font: .82rem var(--f-texto); cursor: pointer; outline: none;
      min-width: 150px; transition: border-color var(--transicao);
    }
    .manut-sel:focus { border-color: var(--laranja); }
    .btn-limpar-manut {
      height: 32px; padding: 0 .75rem; align-self: flex-end;
      border: 1px solid var(--linha-forte); border-radius: var(--raio-p);
      background: transparent; color: var(--texto-2);
      font: .82rem var(--f-texto); cursor: pointer; transition: background var(--transicao);
    }
    .btn-limpar-manut:hover { background: var(--sup-3); }
    .manut-abas {
      display: flex; gap: 2px; flex-wrap: wrap;
      border-bottom: 2px solid var(--linha); margin-bottom: 1.25rem;
    }
    .manut-aba-btn {
      padding: .55rem 1rem; border: none; background: transparent;
      font: 600 .82rem var(--f-titulo); color: var(--texto-3);
      cursor: pointer; border-radius: var(--raio-p) var(--raio-p) 0 0;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      transition: color var(--transicao), border-color var(--transicao);
    }
    .manut-aba-btn:hover { color: var(--texto); }
    .manut-aba-btn.ativa { color: var(--laranja-texto); border-bottom-color: var(--laranja); }
    .manut-painel { display: none; }
    .manut-painel.ativo { display: block; min-width: 0; overflow-x: hidden; }
    .charts-grid-manut {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem; margin-bottom: 1.5rem; min-width: 0; overflow: hidden;
    }
    .chart-card-manut {
      background: var(--sup); border: 1px solid var(--linha);
      border-radius: var(--raio); padding: 1rem 1.1rem;
      box-shadow: var(--sombra); min-width: 0; overflow: hidden; max-width: 100%;
    }
    .chart-card-manut canvas { max-width: 100%; }
    .chart-card-manut.wide { grid-column: 1 / -1; min-width: 0; }
    .chart-titulo-manut {
      font: 700 .88rem var(--f-titulo); color: var(--texto-2);
      margin-bottom: .75rem; padding-bottom: .6rem; border-bottom: 1px solid var(--linha);
    }
    .manut-busca {
      height: 32px; padding: 0 .7rem;
      border: 1px solid var(--linha-forte); border-radius: var(--raio-p);
      background: var(--sup-2); color: var(--texto);
      font: .82rem var(--f-texto); outline: none; min-width: 200px;
      transition: border-color var(--transicao);
    }
    .manut-busca:focus { border-color: var(--laranja); }
    .chip-corretiva { background: var(--alerta-fundo,rgba(244,63,94,.11)); color: var(--alerta); }
    .chip-preventiva { background: var(--ok-fundo,rgba(16,185,129,.13)); color: var(--ok); }
    .chip-peca  { background: var(--laranja-fundo); color: var(--laranja-texto); }
    .chip-serv  { background: var(--aviso-fundo,rgba(245,158,11,.15)); color: var(--aviso); }
    .manut-pag {
      display: flex; align-items: center; justify-content: flex-end; gap: .5rem;
      padding: .6rem .9rem; border-top: 1px solid var(--linha);
      font-size: .78rem; color: var(--texto-3);
    }
    .manut-pag-btn {
      height: 26px; padding: 0 .7rem;
      border: 1px solid var(--linha-forte); border-radius: var(--raio-p);
      background: var(--sup-2); color: var(--texto-2); font-size: .78rem; cursor: pointer;
    }
    .manut-pag-btn:disabled { opacity: .4; cursor: default; }
    .manut-pag-btn:not(:disabled):hover { background: var(--sup-3); }
    thead th[data-col] { cursor: pointer; user-select: none; }
    thead th[data-col]:hover { color: var(--texto); }

    /* ── Rastreamento promo ── */
    .rast-promo {
      background: var(--sup); border: 1px solid var(--linha);
      border-radius: var(--raio); padding: 2rem 1.75rem;
      display: flex; flex-direction: column; gap: 1.1rem; max-width: 520px;
      box-shadow: var(--sombra);
    }
    .rast-promo h2 {
      font-family: var(--f-titulo); font-size: 1.4rem; font-weight: 600; color: var(--texto); margin: 0;
    }
    .rast-promo p  { font-size: .92rem; color: var(--texto-2); line-height: 1.6; margin: 0; }
    .rast-promo ul { font-size: .88rem; color: var(--texto-2); line-height: 2; padding-left: 1.2rem; margin: 0; }
    .btn-primario {
      display: inline-flex; align-items: center; gap: .5rem;
      background: var(--laranja); color: var(--sobre-laranja);
      padding: .7rem 1.3rem; border-radius: var(--raio-p);
      font: 600 .95rem var(--f-texto); text-decoration: none;
      transition: background var(--transicao); align-self: flex-start;
    }
    .btn-primario:hover { background: var(--laranja-hover); }

    /* ═══════════════════════════════════════════════════
       RESPONSIVO — MOBILE
    ═══════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.aberta {
        transform: translateX(0);
        box-shadow: 4px 0 24px rgba(0,0,0,.35);
      }
      .sidebar-overlay.visivel { display: block; }
      .main { margin-left: 0; }
      .btn-menu { display: flex; }
      .topbar { padding: 0 16px; }
      .pagina { padding: 16px; }
      .indicadores-grid { grid-template-columns: repeat(2, 1fr); }
      .abast-grid { grid-template-columns: 1fr 1fr; }
      .grupo-nome { width: 100px; font-size: .82rem; }
      .grupo-valor { width: 86px; font-size: .78rem; }
      .charts-grid-manut { grid-template-columns: 1fr; }
      .abast-filtros, .manut-filtros { flex-direction: column; align-items: stretch; }
      .abast-sel, .manut-sel { max-width: 100%; min-width: 0; }
    }
    @media (max-width: 480px) {
      .indicadores-grid { grid-template-columns: 1fr 1fr; }
      .abast-grid { grid-template-columns: 1fr; }
      .topbar-titulo { font-size: .95rem; }
    }
  </style>
</head>
<body>

  <!-- Overlay mobile -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ═══ SIDEBAR ═════════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img class="logo-claro"  src="/img/logo-rezende.png"        alt="Rezende Energia">
        <img class="logo-escuro" src="/img/logo-rezende-branca.png" alt="Rezende Energia">
      </div>
      <span class="sidebar-badge">Central da Frota</span>
    </div>

    <nav class="sidebar-nav" aria-label="Navegação principal">
      <span class="nav-secao">Painel</span>

      <button class="nav-item active" data-aba="indicadores">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
        Indicadores
      </button>

      <button class="nav-item" data-aba="locacao">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Locação
      </button>

      <button class="nav-item" data-aba="abastecimento">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 22V7l9-4 9 4v15"/><path d="M9 22V12h6v10"/>
          <path d="M18 9.5V4a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v5.5"/><path d="M18 9.5h4"/>
        </svg>
        Abastecimento
      </button>

      <button class="nav-item" data-aba="manutencao">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
